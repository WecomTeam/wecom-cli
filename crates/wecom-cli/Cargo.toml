[package]
name = "wecom-cli"
version.workspace = true
edition = "2024"
description = "The official CLI for WeCom"
license.workspace = true
repository.workspace = true
homepage.workspace = true

[[bin]]
name = "wecom-cli"
path = "src/main.rs"

[features]
custom-endpoint = ["wecom/custom-endpoint"]

[dependencies]
anyhow = { workspace = true }
clap = "4.6"
cliclack = "0.5"
dirs = "6.0.0"
dotenvy = "0.15.7"
image = { version = "0.25", default-features = false, features = ["png"] }
open = "5"
qr2term = "0.3"
qrcode = "0.14"
reqwest = { workspace = true }
serde = { version = "1", features = ["derive"] }
serde_json = { workspace = true }
tempfile = { workspace = true }
time = { version = "0.3", features = ["formatting", "macros"] }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json", "local-time"] }
wecom = { workspace = true }
wecom-auth = { workspace = true }
wecom-runtime = { workspace = true }
wecom-transport = { workspace = true }

[dev-dependencies]
aes-gcm = "0.11"
assert_cmd = "2"
assert-json-diff = "2"
base64 = "0.23"
mockito = "1"
predicates = "3"
serde_json = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true }
wecom = { workspace = true }
wiremock = "0.6"

[[test]]
name = "e2e"
path = "test-e2e/run.rs"
